# WPJ2 N64Recomp Configuration
# Based on Zelda64Recomp/us.rev1.toml, adapted for Wonder Project J2 (JP)

[input]
elf_path = "tools/input/wonderprojectj2.jp.elf"
output_func_path = "src/game/generated/"
entrypoint = 0x80000400
uses_mips3_float_mode = true
bss_section_suffix = ".bss"
single_file_output = false
use_absolute_symbols = false
functions_per_output_file = 50
unpaired_lo16_warnings = true
use_mdebug = false
recomp_include = '#include "recomp.h"'
trace_mode = false
allow_exports = false
strict_patch_mode = false

relocatable_sections_path = ""
symbols_file_path = ""
rom_file_path = ""
output_binary_path = ""
manual_funcs = []
function_sizes = []

[patches]
stubs = []
ignored = [
    "aspMainDataStart", "aspMainDataEnd", "aspMainTextStart", "aspMainTextEnd",
    "gspFast3DDataStart", "gspFast3DDataEnd", "gspFast3DTextStart", "gspFast3DTextEnd",
    "gspFast3DAltDataStart", "gspFast3DAltDataEnd", "gspFast3DAltTextStart", "gspFast3DAltTextEnd",
]
renamed = []
instruction = []
hook = []
